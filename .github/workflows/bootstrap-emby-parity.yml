name: Bootstrap Emby Parity Branch

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  bootstrap:
    if: github.event.issue.title == 'Bootstrap Emby Parity'
    runs-on: ubuntu-latest

    steps:
      - name: Report start
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh issue comment "$ISSUE_NUMBER" --body "Emby parity bootstrap started: $RUN_URL"

      - name: Checkout Emby parity branch
        uses: actions/checkout@v4
        with:
          ref: emby-parity-v1
          fetch-depth: 0

      - name: Import JellyPanel v1 source snapshot
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DIR="$(mktemp -d)"
          git clone --depth=1 https://github.com/gzowner/JellyPanel.git "$SOURCE_DIR/JellyPanel"
          rsync -a --delete --exclude='.git/' "$SOURCE_DIR/JellyPanel/" "$GITHUB_WORKSPACE/"

      - name: Convert source identity to Emby
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os

          root = Path('.')
          replacements = [
              ('GalaxyTV Jellyfin Management Suite', 'GalaxyTV Emby Management Suite'),
              ('GalaxyTV Jellyfin', 'GalaxyTV Emby'),
              ('jellyfin/jellyfin', 'emby/embyserver'),
              ('JELLYFIN', 'EMBY'),
              ('JellyPanel', '3mbyPanel'),
              ('Jellyfin', 'Emby'),
              ('jellyfin', 'emby'),
          ]

          skipped_suffixes = {
              '.png', '.jpg', '.jpeg', '.gif', '.webp', '.ico', '.zip', '.gz',
              '.tar', '.tgz', '.woff', '.woff2', '.ttf', '.otf', '.pdf', '.db',
              '.sqlite', '.pyc', '.class', '.jar', '.so', '.bin'
          }

          for path in sorted(root.rglob('*')):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if path.suffix.lower() in skipped_suffixes:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          # Rename files and directories containing Jellyfin identifiers, deepest paths first.
          for path in sorted(
              [p for p in root.rglob('*') if '.git' not in p.parts],
              key=lambda p: len(p.parts),
              reverse=True,
          ):
              name = path.name
              new_name = (
                  name.replace('JELLYFIN', 'EMBY')
                      .replace('Jellyfin', 'Emby')
                      .replace('jellyfin', 'emby')
              )
              if new_name != name:
                  target = path.with_name(new_name)
                  if not target.exists():
                      path.rename(target)

          Path('PORTING.md').write_text('''# 3mbyPanel Emby Parity Port\n\nThis branch is a one-time source snapshot of the stable `gzowner/JellyPanel` v1 management suite, converted into an independent Emby development branch.\n\n## Safety\n\n- Development branch: `emby-parity-v1`\n- Existing `main` branch remains untouched.\n- No future automatic synchronization from JellyPanel is configured.\n\n## Port status\n\n### Seeded from the stable panel\n\n- Guided Ubuntu 24.04 installer and lifecycle modes\n- PostgreSQL and Redis services\n- Admin/reseller sessions, CSRF, throttling, and audit logging\n- User expiration, packages, connection limits, and credit accounting\n- M3U/XMLTV source management and EPG mapping\n- STRM/NFO media mirror and TMDB metadata workflow\n- Stream monitoring and operations controls\n- Operations Center, backups, restore, and diagnostics\n\n### Emby-native conversion still required\n\n- Emby authentication and API-key handling\n- User creation, password, policy, expiration, and access controls\n- Active-session normalization and playback controls\n- Live TV tuner and guide refresh operations\n- Emby configuration/database backup paths\n- Emby container health checks and installer validation\n- Native Emby policy mapping for downloads, remote access, transcoding, remuxing, Live TV, movies, and series\n\nThe broad identity conversion in this commit is only the foundation. Each API integration must be validated against a real Emby server before merging into `main`.\n''', encoding='utf-8')
          PY

      - name: Commit imported Emby foundation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Seed Emby parity branch from stable JellyPanel v1 source'
          git push origin HEAD:emby-parity-v1

      - name: Report completion
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "The full JellyPanel v1 source was imported and converted into the independent **emby-parity-v1** branch. Native Emby API replacement and validation can now begin."
          gh issue close "$ISSUE_NUMBER" --reason completed
